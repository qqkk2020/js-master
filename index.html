<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSMaster - Інтерактивний тренажер із JavaScript</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo">⚡ JSMaster</div>
            <div class="team-badge">ScriptCrafters</div>
        </div>
    </header>

    <main class="container">
        <!-- Экран каталога -->
        <section id="catalog-screen" class="screen">
            <div class="hero">
                <h1>Інтерактивний тренажер із мови JavaScript</h1>
                <p>Опануйте сучасний синтаксис ES6+ та алгоритмічні конструкції за 10 хвилин на день</p>
                <div id="daily-tip-banner" class="daily-tip hidden"></div>
            </div>
            <div id="topics-grid" class="topics-grid"></div>
        </section>

        <!-- Экран теории -->
        <section id="theory-screen" class="screen hidden">
            <div id="theory-content"></div>
        </section>

        <!-- Экран теста -->
        <section id="quiz-screen" class="screen hidden">
            <div class="quiz-card">
                <div id="question-header" class="question-header"></div>
                <h3 id="question-text"></h3>
                <div id="question-code" class="code-container hidden">
                    <pre class="code-block"><code></code></pre>
                </div>
                <div id="options-container" class="options-container"></div>
                <div id="feedback" class="feedback hidden"></div>
                <div class="quiz-actions">
                    <button id="next-btn" class="btn btn-primary hidden">Наступне завдання →</button>
                </div>
            </div>
        </section>

        <!-- Экран результата -->
        <section id="result-screen" class="screen hidden">
            <div class="result-card">
                <h2>Вітаємо! Модуль завершено 🎉</h2>
                <div id="result-score"></div>
                <div class="result-actions">
                    <button id="retry-topic-btn" class="btn btn-secondary">Пройти знову ↺</button>
                    <button id="back-to-catalog-btn" class="btn btn-primary">До каталогу тем</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 ScriptCrafters (Ященко Єгор, СОІ-23-1). Навчальний проєкт «JSMaster».</p>
    </footer>

    <script type="module" src="src/js/app.js"></script>
</body>
</html>
